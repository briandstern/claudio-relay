[phases.setup]
apt_pkgs = ["fonts-liberation", "fonts-dejavu-core", "fontconfig"]

[phases.build]
cmds = ["PLAYWRIGHT_BROWSERS_PATH=/app/pw-browsers .venv/bin/playwright install chromium --with-deps"]

[start]
cmd = "PLAYWRIGHT_BROWSERS_PATH=/app/pw-browsers uvicorn main:app --host 0.0.0.0 --port $PORT"
